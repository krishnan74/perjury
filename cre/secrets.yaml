# Maps the secret id requested via runtime.getSecret({ id }) to the env var
# holding its value. The Vault DON releases these directly into the attested
# enclave — never in plaintext to node operators.
#
# COMMITMENT_SALT binds the evidence commitment. Keeping it secret means the
# published commitment cannot be brute-forced back to the sealed evidence.
#
# ENVELOPE_KEY is the private half of the evidence envelope key. The agents seal
# each bundle to its public half before publishing, so the gateway store holds
# ciphertext and this enclave is the only place that can read it. Losing this key
# makes past evidence permanently unreadable, which is the intended property.
secretsNames:
    COMMITMENT_SALT:
        - PERJURY_COMMITMENT_SALT
    ENVELOPE_KEY:
        - PERJURY_ENVELOPE_KEY
